  <section class="contact draggable">
    <div class="header">
      <div class="title">Contact me</div>

    <div class="contact-content">
    <form action="send.php" method="POST" id="contact_form" class="grid-container">
      <div id="contact_name">
        <input type="text" name="name" id="txt_name" placeholder="Your Name" required>

        <input type="tel" name="phone" id="txt_phone" placeholder="Your Phone (optional)"
          pattern="\+?(?=(?:\D*\d){7,15}\D*$)[0-9.\s\(\)\-]+" maxlength="20" inputmode="tel" autocomplete="tel"

  <script>
    const params = new URLSearchParams(window.location.search);
    const artParam = params.get('art');
    const status = params.get('status');
    const artId = artParam !== null && /^\d+$/.test(artParam) ? Number(artParam) : null;
    const artwork = artId !== null ? artworks[artId] : null;
    const contactTitle = document.getElementById('contact_title');
    const backLink = document.getElementById('back_link');
    const statusMessage = document.getElementById('sent_msg');

    if (artwork) {
      document.body.classList.add('art');
      contactTitle.textContent = 'Art Inquiry';
      document.getElementById('sample_img').src = `/imgs/${artwork.section}/${artwork.file}`;
      document.getElementById('sample_img').alt = artwork.title;
      document.getElementById('art_title').textContent = artwork.title;
      document.getElementById('art_id').value = String(artId);
      if (backLink) backLink.href = 'javascript:history.back()';
    }

    if (statusMessage && status === 'sent') {
      statusMessage.textContent = 'Your message was sent. Thank you for your interest! ♥';
      statusMessage.hidden = false;
    } else if (statusMessage && status === 'error') {
      statusMessage.textContent = 'There was a problem sending your message. Please try again.';
      statusMessage.hidden = false;
    }

  let highestZIndex = 100;
  function bringToFront(panel) {
    highestZIndex += 1;
    panel.style.zIndex = highestZIndex;
  }



  // Ensure an element stays inside the viewport when opened (not during drag)
  function ensureInViewport(el, padding = 8) {
    if (!el) return;
    // skip if this element is being dragged
      if (el.classList.contains('dragging')) return;

    // remove transform to compute accurate rect and force layout
    el.style.transform = 'none';
    void el.offsetWidth;
    const rect = el.getBoundingClientRect();

    // compute clamped left/top so the element fits inside viewport
    const width = rect.width;
    const height = rect.height;
    const leftCurrent = rect.left + window.scrollX;
    const topCurrent = rect.top + window.scrollY;

    const leftMin = padding;
    const leftMax = Math.max(leftMin, window.innerWidth - width - padding);
    const topMin = padding;
    const topMax = Math.max(topMin, window.innerHeight - height - padding);

    const clampedLeft = Math.min(Math.max(leftCurrent, leftMin), leftMax);
    const clampedTop = Math.min(Math.max(topCurrent, topMin), topMax);

    el.style.left = clampedLeft + 'px';
    el.style.top = clampedTop + 'px';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
  }


  // Drag functionality for nav
  const nav = document.querySelector('nav');
  let navIsDragging = false;
  let navDragStartX = 0;
  let navDragStartY = 0;
  let navStartLeft = 0;
  let navStartTop = 0;

  nav.addEventListener('mousedown', (e) => {
    // Don't drag if clicking on a link
    if (e.target.tagName === 'A') return;

    bringToFront(nav);
    navIsDragging = true;
    navDragStartX = e.clientX;
    navDragStartY = e.clientY;

    // Get computed styles to get actual pixel values
    const rect = nav.getBoundingClientRect();
    navStartLeft = rect.left + window.scrollX;
    navStartTop = rect.top + window.scrollY;

    nav.classList.add('dragging');
  });

  // Touch support for nav dragging
  nav.addEventListener('touchstart', (e) => {
    if (!e.touches || e.touches.length !== 1) return;
    // don't start dragging when touching the close button or links
    if (e.target.tagName === 'A' || (e.target.closest && e.target.closest('.close-btn'))) return;
    e.preventDefault();
    bringToFront(nav);
    navIsDragging = true;
    navDragStartX = e.touches[0].clientX;
    navDragStartY = e.touches[0].clientY;
    const rect = nav.getBoundingClientRect();
    navStartLeft = rect.left + window.scrollX;
    navStartTop = rect.top + window.scrollY;
    nav.classList.add('dragging');
  }, { passive: false });

  document.addEventListener('touchmove', (e) => {
    if (!navIsDragging) return;
    if (!e.touches || e.touches.length === 0) return;
    const deltaX = e.touches[0].clientX - navDragStartX;
    const deltaY = e.touches[0].clientY - navDragStartY;
    nav.style.left = (navStartLeft + deltaX) + 'px';
    nav.style.top = (navStartTop + deltaY) + 'px';
    nav.style.right = 'auto';
    nav.style.bottom = 'auto';
  }, { passive: false });

  document.addEventListener('touchend', (e) => {
    navIsDragging = false;
    nav.classList.remove('dragging');
  });

  document.addEventListener('mousemove', (e) => {
    if (!navIsDragging) return;

    const deltaX = e.clientX - navDragStartX;
    const deltaY = e.clientY - navDragStartY;

    nav.style.left = (navStartLeft + deltaX) + 'px';
    nav.style.top = (navStartTop + deltaY) + 'px';
    nav.style.right = 'auto';
    nav.style.bottom = 'auto';
  });

  document.addEventListener('mouseup', () => {
    navIsDragging = false;
    nav.classList.remove('dragging');
  });

  // Nav close button functionality
  const navCloseBtn = nav.querySelector('.close-btn');
  let navIsHidden = false;

  if (navCloseBtn) {
    navCloseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (navIsHidden) {
        // Show ul
        nav.classList.remove('collapsed');


        navIsHidden = false;
        // Set nav to active
        document.querySelectorAll('.draggable').forEach(el => el.classList.remove('active'));
        nav.classList.add('active');
        // ensure nav stays visible if opening
        ensureInViewport(nav);
      } else {
        // Hide ul
        nav.classList.add('collapsed');
        navIsHidden = true;
      }
    });
  }

  //clicking on background removes active class from sections
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.draggable') && !e.target.closest('a') && !e.target.closest('.close-btn')) {
      document.querySelectorAll('.draggable').forEach(el => el.classList.remove('active'));
    }
  });

  function enableDrag(panel) {
    if (!panel) return;

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let startLeft = 0;
    let startTop = 0;

    function beginDrag(clientX, clientY) {
      bringToFront(panel);
      dragging = true;
      startX = clientX;
      startY = clientY;
      const rect = panel.getBoundingClientRect();
      startLeft = rect.left + window.scrollX;
      startTop = rect.top + window.scrollY;
      panel.classList.add('dragging');
    }

    function moveDrag(clientX, clientY) {
      if (!dragging) return;
      panel.style.left = startLeft + clientX - startX + 'px';
      panel.style.top = startTop + clientY - startY + 'px';
      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      panel.style.transform = 'none';
    }

    function endDrag() {
      dragging = false;
      panel.classList.remove('dragging');
    }

    panel.addEventListener('mousedown', (e) => {
      if (e.target.closest('a, .close-btn')) return;
      beginDrag(e.clientX, e.clientY);
    });

    panel.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1 || e.target.closest('a, .close-btn')) return;
      e.preventDefault();
      beginDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);
  }

  // Drag functionality for contact panels
  const contactPanel = document.querySelector('.contact-content')?.closest('.contact') || document.querySelector('.contact');
  const inquiryPanel = document.querySelector('.inquiry-art');
  enableDrag(inquiryPanel);
  enableDrag(contactPanel);

  if (contactPanel) {

    // contact close button functionality
    const contactCloseBtn = contactPanel.querySelector('.close-btn');
    // initialize hidden state based on class
    let contactIsHidden = contactPanel.classList.contains('collapsed');
    if (contactCloseBtn) {
      contactCloseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const EXPANDED_WIDTH = 800;
        const padding = 8;
        if (contactIsHidden) {
          contactPanel.classList.remove('collapsed');
          contactPanel.classList.add('expanded');
          // Set contact to active
          document.querySelectorAll('.draggable').forEach(el => el.classList.remove('active'));
          contactPanel.classList.add('active');

          // set an outer target width that won't exceed the viewport
          const maxOuter = Math.max(0, window.innerWidth - padding * 2);
          const outer = Math.min(EXPANDED_WIDTH, maxOuter);
          const cs = window.getComputedStyle(contactPanel);
          const padLeft = parseFloat(cs.paddingLeft) || 0;
          const padRight = parseFloat(cs.paddingRight) || 0;
          const bL = parseFloat(cs.borderLeftWidth) || 0;
          const bR = parseFloat(cs.borderRightWidth) || 0;
          const extras = padLeft + padRight + bL + bR;
          if (cs.boxSizing === 'content-box') {
            contactPanel.style.width = Math.max(0, outer - extras) + 'px';
          } else {
            contactPanel.style.width = outer + 'px';
          }

          // anchor to the right (expand left) when the panel is on the right half
          const before = contactPanel.getBoundingClientRect();
          const centerX = before.left + before.width / 2;
          if (centerX >= window.innerWidth / 2) {
            contactPanel.style.right = padding + 'px';
            contactPanel.style.left = 'auto';
          } else {
            // keep left anchoring
            contactPanel.style.left = before.left + 'px';
            contactPanel.style.right = 'auto';
          }


          // ensure final placement after transition completes
          const onT = (ev) => {
            if (ev.propertyName === 'width') ensureInViewport(contactPanel);
          };
          contactPanel.addEventListener('transitionend', onT, { once: true });

          contactIsHidden = false;
        } else {
          contactPanel.classList.remove('expanded');
          contactPanel.classList.add('collapsed');
          contactPanel.style.width = '';
          contactPanel.style.right = '';
          contactIsHidden = true;
        }
      });

      if (window.location.hash === '#contact') {
        contactCloseBtn.click();
      }
    }
  }

  // Active class toggling for draggable sections
  function setActiveSection(e) {
    const draggables = document.querySelectorAll('.draggable');
    const clicked = e.target.closest('.draggable');

    // Only set active if clicking on a draggable section (not on links or close buttons)
    if (clicked && !e.target.closest('a') && !e.target.closest('.close-btn')) {
      draggables.forEach(d => d.classList.remove('active'));
      clicked.classList.add('active');
    }
  }

  document.addEventListener('click', setActiveSection);
  document.addEventListener('touchend', setActiveSection);
  </script>
